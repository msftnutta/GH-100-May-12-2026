name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Cache dependencies
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: deps-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}

  build:
    runs-on: ubuntu-latest
    needs: dependencies

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Verify application
        run: node -e "require('./server.js')" && echo "Build verification passed"

  test:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: deps-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm test
